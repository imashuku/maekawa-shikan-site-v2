<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .richmenu {
            width: 2500px;
            height: 843px;
            background: #1a1a1a;
            display: flex;
            font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
        }
        .section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Use border-bottom for the red accent line */
            border-bottom: 20px solid #9d2b2b;
            box-sizing: border-box; /* Includes border in the height */
        }
        .section:not(:last-child) {
            border-right: 2px solid #333;
        }
        .icon {
            margin-bottom: 30px;
            color: #fff;
            /* Adjust icon visual center */
            margin-top: 20px; 
        }
        .label {
            font-size: 72px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        /* SVG Icons - much larger */
        .icon svg {
            width: 160px;
            height: 160px;
            fill: #fff;
        }
    </style>
</head>
<body>
    <div class="richmenu">
        <div class="section">
            <div class="icon">
                <!-- Book/Document icon -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 2H6c-1.206 0-3 .799-3 3v14c0 2.201 1.794 3 3 3h15v-2H6.012C5.55 19.988 5 19.806 5 19c0-.101.009-.191.024-.273.112-.576.584-.717.988-.727H21V4a2 2 0 0 0-2-2zm0 9-2-1-2 1V4h4v7z"/>
                </svg>
            </div>
            <div class="label">前川史観とは？</div>
        </div>
        <div class="section">
            <div class="icon">
                <!-- YouTube icon -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21.593 7.203a2.506 2.506 0 0 0-1.762-1.766C18.265 5.007 12 5 12 5s-6.264-.007-7.831.404a2.56 2.56 0 0 0-1.766 1.778c-.413 1.566-.417 4.814-.417 4.814s-.004 3.264.406 4.814c.23.857.905 1.534 1.763 1.765 1.582.43 7.83.437 7.83.437s6.265.007 7.831-.403a2.515 2.515 0 0 0 1.767-1.763c.414-1.565.417-4.812.417-4.812s.02-3.265-.407-4.831zM9.996 15.005l.005-6 5.207 3.005-5.212 2.995z"/>
                </svg>
            </div>
            <div class="label">YouTube</div>
        </div>
        <div class="section">
            <div class="icon">
                <!-- Share icon -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
                </svg>
            </div>
            <div class="label">友だちに教える</div>
        </div>
    </div>
</body>
</html>
